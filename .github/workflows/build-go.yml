name: Build Go Binary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-go.yml'
      - 'go/Containerfile'
      - 'go/**/*.go'
      - 'go/go.mod'
      - 'go/build.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Go Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Go binary in builder container
        env:
          IMAGE: embedded-cicd-go-build:ci
        run: |
          mkdir -p go/dist
          docker build \
            --file go/Containerfile \
            --target build \
            --tag "$IMAGE" \
            go
          docker run --rm \
            --user root \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/go,target=/workspace" \
            "$IMAGE" \
            sh -c 'OUTPUT=/workspace/dist/api_client ./build.sh'

      - name: Upload Go binary
        uses: actions/upload-artifact@v6
        with:
          name: go-binary
          path: go/dist/api_client
          if-no-files-found: error
