name: Build Go Binary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-go.yml'
      - 'go/**/*.go'
      - 'go/go.mod'
      - 'go/go.sum'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build Go Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image namespace
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "namespace=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Go binary in builder container
        env:
          IMAGE: ${{ steps.image.outputs.namespace }}/go-builder:latest
        run: |
          mkdir -p go/dist
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/go,target=/workspace" \
            "$IMAGE" \
            go build -o /workspace/dist/hello_world hello_world.go

      - name: Upload Go binary
        uses: actions/upload-artifact@v4
        with:
          name: go-binary
          path: go/dist/hello_world
          if-no-files-found: error
