name: Build and Push Go Runtime Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/builder-go.yml'
      - 'go/Containerfile'
      - 'go/**/*.go'
      - 'go/go.mod'
      - 'go/go.sum'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Go Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize image namespace
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "namespace=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Go binary
        env:
          IMAGE: embedded-cicd-go-build:ci
        run: |
          mkdir -p go/dist
          docker build \
            --file go/Containerfile \
            --target build \
            --tag "$IMAGE" \
            go
          docker run --rm \
            --user root \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/go,target=/workspace" \
            "$IMAGE" \
            go build -o /workspace/dist/hello_world .

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./go
          file: ./go/Containerfile
          push: true
          tags: ${{ steps.image.outputs.namespace }}/go-runtime:latest
