name: Build and Push Go Builder Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/builder-go.yml'
      - 'go/Containerfile'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Go Builder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize image namespace
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "namespace=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./go
          file: ./go/Containerfile
          push: true
          tags: ${{ steps.image.outputs.namespace }}/go-builder:latest
