name: Build and Push Rust Runtime Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/builder-rust.yml'
      - 'rust/Containerfile'
      - 'rust/**/*.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Rust Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize image namespace
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "namespace=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rust binary
        env:
          IMAGE: embedded-cicd-rust-build:ci
        run: |
          mkdir -p rust/dist
          docker build \
            --file rust/Containerfile \
            --target build \
            --tag "$IMAGE" \
            rust
          docker run --rm \
            --user root \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/rust,target=/workspace" \
            "$IMAGE" \
            sh -c 'cargo build --release && cp target/release/hello /workspace/dist/hello_world'

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./rust
          file: ./rust/Containerfile
          push: true
          tags: ${{ steps.image.outputs.namespace }}/rust-runtime:latest
