name: Build Rust Binary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-rust.yml'
      - 'rust/Containerfile'
      - 'rust/**/*.rs'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/rust-toolchain.toml'
      - 'rust/build.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Rust Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Rust binary in builder container
        env:
          IMAGE: embedded-cicd-rust-build:ci
        run: |
          mkdir -p rust/dist
          docker build \
            --file rust/Containerfile \
            --target build \
            --tag "$IMAGE" \
            rust
          docker run --rm \
            --user root \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/rust,target=/workspace" \
            "$IMAGE" \
            sh -c 'OUTPUT=/workspace/dist/api_server ./build.sh'

      - name: Upload Rust binary
        uses: actions/upload-artifact@v6
        with:
          name: rust-binary
          path: rust/dist/api_server
          if-no-files-found: error
