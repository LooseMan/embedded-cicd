build-go-builder:
  stage: build
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/go-builder:latest"
    - docker build --pull --file go/Containerfile --tag "$IMAGE" go
    - docker push "$IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/builder-go.yml
        - .github/workflows/builder-go.yml
        - go/Containerfile